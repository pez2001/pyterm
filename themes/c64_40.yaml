name: c64_40
description: "faithful 40x25 C64 text screen - the original 8x8 font in the real 320x200 area, exact 16 colors, nothing added; for C64 text content, BASIC listings, emulator or 40-column output (wide shell output gets cropped or wrapped like on the real machine)"
palette: ['#000000', '#9a6759', '#588d43', '#b8c76f', '#352879', '#6f3d86', '#70a4b2', '#959595',
          '#444444', '#9a6759', '#9ad284', '#b8c76f', '#6c5eb5', '#6f3d86', '#70a4b2', '#ffffff']
fg: '#6c5eb5'
bg: '#352879'
bg_alpha: 255
cursor: '#6c5eb5'
cursor_style: block
cursor_effects: []
bold_bright: true
text_shadow: false
font: builtin:fat8
screen: {cols: 40, rows: 25, border: [32, 36]}   # the original 40x25 text screen inside the 384x272 frame
splash: none                 # c64_clean = plain boot sequence, c64 = with loading screen
border_solid: true
border_color: '#6c5eb5'
border_fx: none
background: []
letter_effect: none
delete_effect: none
alt_effects: false
drama: false
writer: {mode: instant}
palette_lock:               # every color snaps to the 16 C64 colors (no dithering)
  mode: nearest
  dither: 0
  colors: ['#000000', '#ffffff', '#68372b', '#70a4b2', '#6f3d86', '#588d43', '#352879', '#b8c76f',
           '#6f4f25', '#433900', '#9a6759', '#444444', '#6c6c6c', '#9ad284', '#6c5eb5', '#959595']
command_blocks: false        # no gutter / separator lines from shell integration
crt: {scanlines: 0, vignette: 0, bloom: 0, phosphor: 0, flicker: 0, noise: 0, glitch: 0, aberration: 0, curvature: 0, interlace: 0}
sound: {pack: 'off', volume: 0}
banner: "\n    **** COMMODORE 64 BASIC V2 ****\n\n 64K RAM SYSTEM  38911 BASIC BYTES FREE\n\nREADY.\n"
