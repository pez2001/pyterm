palette: ['#203018', '#e85a7a', '#5ab04a', '#e8b030', '#4a8ad0', '#b070d0', '#3ab0b0', '#ffffff',
          '#506040', '#ff8aa6', '#8ad87a', '#ffd870', '#8ab4f0', '#d0a0f0', '#7ad8d8', '#ffffff']
