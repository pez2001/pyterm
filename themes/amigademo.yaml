name: amigademo
description: "cracktro style - big outlined Amiga font with a copper color sweep running through the letters, starfield & copper bars, letters drop in"
palette: ['#000010', '#ff4040', '#50e050', '#ffd040', '#4070ff', '#e050ff', '#40e0ff', '#ffffff',
          '#606080', '#ff8080', '#90ff90', '#ffe890', '#90a8ff', '#f090ff', '#90f0ff', '#ffffff']
fg: '#ffffff'
bg: '#000010'
bg_alpha: 0
cursor: '#ffd040'
cursor_style: block
cursor_effects: [glow]
text_shadow: true
font: builtin:amiga
scale: 2
border: 8
background: [starfield, copper]
bg_params: {starfield: {count: 300}}
bg_dim: 0.55
letter_effect: drop
delete_effect: bricks
crt: {scanlines: 0.3, vignette: 0.45, bloom: 0.35}
sound: {pack: 8bit, volume: 0.3}
banner: "\n  PIXELTERM PRESENTS\n  A DEMO-STYLE TERMINAL\n\n"
plugins: {sine_scroller: {enabled: true}}
