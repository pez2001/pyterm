name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Byte-compile
        run: python -m compileall -q pyterm tools
      - name: Pyflakes (undefined names / syntax only)
        run: |
          if python -m pyflakes pyterm tools | grep -E "undefined name|syntax"; then exit 1; fi
      - name: Validate YAML (config + themes)
        run: |
          python - <<'PY'
          import glob, yaml
          for f in ['pyterm/data/config.yaml', *glob.glob('pyterm/data/themes/*.yaml')]:
              yaml.safe_load(open(f, encoding='utf-8'))
              print('ok', f)
          PY

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install paho-mqtt
      - name: Show installed packages
        run: pip list
      - name: Import check
        run: python -c "import pygame, numpy, yaml, pyterm.app; print('imports ok')"
      - name: CLI help
        run: python -m pyterm --help
      - name: Headless smoke test (demo shell)
        run: python tools/ci_smoke.py
      - name: Settings migration from the 1.0.0 'pyvterm' folder
        run: python tools/ci_migration.py

  clean-venv:
    name: clean venv install (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh venv + pip install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy .venv/bin/python tools/ci_smoke.py

  package:
    name: build + install wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel into a fresh venv and run it
        shell: bash
        run: |
          python -m venv /tmp/wheelenv
          if [ -d /tmp/wheelenv/Scripts ]; then BIN=/tmp/wheelenv/Scripts; else BIN=/tmp/wheelenv/bin; fi
          "$BIN/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/pyterm" --list
          "$BIN/python" "$GITHUB_WORKSPACE/tools/ci_smoke.py" neon c64
      - name: Check bundled assets are in the wheel
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          for part in ('data/themes/neon.yaml', 'data/fonts/', 'data/sounds/', 'data/plugins/', 'data/shell/', 'data/config.yaml'):
              assert any(part in n for n in names), 'missing in wheel: ' + part
          print('wheel ok,', len(names), 'files')
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
