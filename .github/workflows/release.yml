name: Release

# Publish a release by pushing a version tag:  git tag v1.2.3 && git push origin v1.2.3
# (the tag must match pyterm/__init__.py __version__).  Builds, tests the wheel on
# Linux/Windows/macOS, publishes to PyPI (trusted publishing) and creates the GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import re;print(re.search(r\"__version__ = '([^']+)'\", open('pyterm/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyterm.__version__ $VERSION" >&2; exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install wheel and smoke test
        shell: bash
        run: |
          python -m venv /tmp/wheelenv
          if [ -d /tmp/wheelenv/Scripts ]; then BIN=/tmp/wheelenv/Scripts; else BIN=/tmp/wheelenv/bin; fi
          "$BIN/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/pyterm" --list
          "$BIN/python" "$GITHUB_WORKSPACE/tools/ci_smoke.py" neon c64

  publish-pypi:
    needs: test-wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyterm
    permissions:
      id-token: write   # PyPI trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pyterm ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
