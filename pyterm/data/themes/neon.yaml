# pyterm theme - every key is optional, see docs/THEMES.md
name: neon
description: plasma glow, burning letters, bloom - the default overkill
palette: ['#101018', '#ff3b6b', '#3bff8f', '#ffd23b', '#3b8bff', '#c23bff', '#3bf0ff', '#d8dce8',
          '#4a4e6a', '#ff6b8f', '#7affb4', '#ffe57a', '#7ab0ff', '#dd7aff', '#7af6ff', '#ffffff']
fg: '#d8f0ff'
bg: '#05050c'
bg_alpha: 140
cursor: '#ff3bd2'
cursor_effects: [glow, trail]
text_shadow: true
font: builtin
background: [plasma]
bg_dim: 0.22
letter_effect: flame
delete_effect: shatter
crt: {scanlines: 0.3, vignette: 0.5, bloom: 0.55, flicker: 0.02, noise: 0.1, aberration: 1}
sound: {pack: chime, volume: 0.35}

# shows on events (see docs/THEMES.md): success/fail = a command that ran >= notify_after seconds
events:
  success: confetti palette=neon duration=6
  fail: shockwave
