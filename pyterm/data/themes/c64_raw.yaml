name: c64_raw
description: "the plain C64 - quiet text-only boot, real 40x25 screen inside the light blue border, crisp 8x8 font, exact C64 colors; no CRT, no glow, no letter effects, no loading stripes, no sound"
palette: ['#000000', '#9a6759', '#588d43', '#b8c76f', '#352879', '#6f3d86', '#70a4b2', '#959595',
          '#444444', '#9a6759', '#9ad284', '#b8c76f', '#6c5eb5', '#6f3d86', '#70a4b2', '#ffffff']
fg: '#6c5eb5'
bg: '#352879'
bg_alpha: 255
cursor: '#6c5eb5'
cursor_style: block
cursor_effects: []
bold_bright: true
text_shadow: false
font: builtin:c64narrow       # 80 columns in the C64's 320 px (the 40-column original: theme c64_40)
screen: {cols: 80, rows: 25, border: [32, 36]}   # 320x200 text area inside the 384x272 frame, 80-column mode
splash: c64_clean            # plain boot: LOAD"$",8,1 / LIST / LOAD / RUN, no stripes (c64 = with loading screen, none = off)
border_solid: true
border_color: '#6c5eb5'
border_fx: none
background: []
letter_effect: none
delete_effect: none
alt_effects: false
drama: false
writer: {mode: instant}
palette_lock:               # every color snaps to the 16 C64 colors (no dithering)
  mode: nearest
  dither: 0
  colors: ['#000000', '#ffffff', '#68372b', '#70a4b2', '#6f3d86', '#588d43', '#352879', '#b8c76f',
           '#6f4f25', '#433900', '#9a6759', '#444444', '#6c6c6c', '#9ad284', '#6c5eb5', '#959595']
command_blocks: false        # no gutter / separator lines from shell integration
crt: {scanlines: 0, vignette: 0, bloom: 0, phosphor: 0, flicker: 0, noise: 0, glitch: 0, aberration: 0, curvature: 0, interlace: 0}
sound: {pack: 'off', volume: 0}
banner: "\n PYTERM 64  V1.0   (C) 2026 THE SCENE\n\nREADY.\n"
